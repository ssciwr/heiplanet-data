[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "heiplanet-data"
license = "MIT"
dynamic = ["version"]
readme = "README.md"
description = "Data processing pipeline for heiplanet"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
  { name="Tuyen Le", email="ssc@iwr.uni-heidelberg.de" },
  { name="Inga Ulusoy", email="ssc@iwr.uni-heidelberg.de" },
]

dependencies = [
  "cdsapi",
  "xarray",
  "netcdf4",
  "cfgrib",
  "jupyter",
  "matplotlib",
  "geopandas",
  "dask[complete]",
  "scipy",
  "isimip-client",
  "xesmf",
  "cdo",
  "xagg",
  "exactextract",
  "rioxarray",
  "jsonschema",
  "huggingface-hub",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    ]

docs = [
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocs-glightbox",
    "mkdocs-jupyter",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-minify-plugin",
    "mkdocstrings-python",
]

[project.urls]
Homepage = "https://github.com/ssciwr/heiplanet-data"
Issues = "https://github.com/ssciwr/heiplanet-data/issues"

[tool.hatch.build.targets.wheel]
packages = ["heiplanet_data"]
include-package-data = true
include = [
  "heiplanet_data/*.json"
]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
markers = [
    "integration: exercises the example scripts end-to-end against the real CDS/ISIMIP APIs; run via the integration.yml workflow",
]

[tool.ruff.lint]
extend-ignore = [
  # DTZ00x: the domain here is plain calendar dates (YYYY-MM-DD) with no
  # timezone concept; forcing tz-aware datetimes throughout would be noise.
  "DTZ001",
  "DTZ005",
  "DTZ007",
  # BLE001: utils.load_json intentionally falls back to defaults on any
  # failure to load/parse a user-supplied settings file.
  "BLE001",
]